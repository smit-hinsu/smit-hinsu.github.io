<!DOCTYPE html>
<!--
  POST TEMPLATE — how to publish a new blog post:
  1. Copy this file to posts/YYYY-MM-slug.html  (e.g. posts/2026-08-ml-efficiency.html)
  2. Fill in <title>, the meta description, the h1 title, the date, and the body.
  3. Open index.html, find the Blog panel, and uncomment the <ul class="posts"> block,
     adding a <li class="post"> entry that links to this file (newest first).
  This file itself is a template and is not linked from the site.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post title — Smit Hinsu</title>
  <meta name="description" content="One-sentence summary of the post." />
  <link rel="stylesheet" href="post.css" />
</head>
<body>
  <article class="article">
    <a class="back" href="../index.html#blog">← Smit Hinsu</a>

    <h1 class="article__title">Post title goes here</h1>
    <p class="article__date">August 2026</p>

    <div class="article__body">
      <p>Opening paragraph. Write the post here using normal HTML — headings
      (<code>&lt;h2&gt;</code>), paragraphs, lists, <code>&lt;blockquote&gt;</code>,
      images, and code blocks are all styled.</p>

      <h2>A section heading</h2>
      <p>More content…</p>
    </div>
  </article>

  <!-- Cloudflare Web Analytics -->
  <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "1af7b86fe76246b097cf1adda6d0c125"}'></script>
  <!-- End Cloudflare Web Analytics -->
</body>
</html>
